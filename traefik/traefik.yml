api:
  insecure: false
  dashboard: true

log:
  level: WARN
  format: json

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    network: psibase_net
  
  file:
    directory: "/etc/traefik/config"
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

http:
  tls:
    options:
      default:
        minVersion: "VersionTLS13"

certificatesResolvers:
  cloudflare:
    acme:
      storage: "/etc/traefik/acme/acme.json"
      dnsChallenge:
        provider: cloudflare
        propagation:
          delayBeforeChecks: 30s
