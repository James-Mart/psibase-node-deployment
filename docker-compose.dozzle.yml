services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      psibase_net:
        ipv4_address: 172.30.0.40
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped